[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgk"
version = "0.1.2"
description = "Local electrostatic and electromagnetic gyrokinetic eigenvalue solver"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2"]
keywords = ["gyrokinetics", "plasma physics", "ITG", "TEM", "eigenvalue solver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
vmec = ["netCDF4>=1.6,<2"]
gpu12 = ["cupy-cuda12x>=13,<15"]
gpu13 = ["cupy-cuda13x>=14,<15"]

[tool.pytest.ini_options]
testpaths = ["mgk/tests"]

[tool.setuptools]
py-modules = ["mgk1d"]

[tool.setuptools.packages.find]
include = ["mgk*"]
exclude = ["mgk.*.__pycache__"]
